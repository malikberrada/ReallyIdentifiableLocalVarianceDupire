name: Peer-review reproduction
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PYTHONUTF8: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/review.txt
      - run: python -m pip install -r requirements/review.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python scripts/download_data.py --offline
      - run: python scripts/reproduce.py --inputs data/downloaded/taifex_txo --out runs/review
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: review-${{ matrix.os }}
          path: runs/review/
